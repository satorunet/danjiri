<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>だんじりエディター</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --panel: rgba(16, 12, 32, 0.8); --gold: #f2c14e; --red: #e2402f; --ink: #fff; --sub: rgba(255,255,255,0.7); --line: rgba(255,255,255,0.18); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe6f5; color: var(--ink); font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 700; -webkit-tap-highlight-color: transparent; }
  canvas.gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #head { position: fixed; top: 12px; left: 16px; display: flex; align-items: center; gap: 10px; pointer-events: none; }
  #head h1 { margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 24px; color: #1b1020; text-shadow: 0 2px 0 #fff, 0 0 12px rgba(255,255,255,0.8); }
  #head .beta { font-size: 12px; background: var(--red); color: #fff; border-radius: 6px; padding: 2px 8px; }
  #back { position: fixed; bottom: 14px; left: 16px; color: #1b1020; background: rgba(255,255,255,0.85); border-radius: 999px; padding: 8px 14px; font-size: 14px; text-decoration: none; }
  #panel { position: fixed; top: 12px; right: 12px; bottom: 12px; width: 330px; background: var(--panel); backdrop-filter: blur(6px); border-radius: 16px; padding: 14px; overflow-y: auto; }
  #panel h2 { font-size: 14px; color: var(--gold); margin: 14px 0 6px; font-weight: 700; }
  #panel h2:first-child { margin-top: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .row button, .acts button { font: inherit; font-size: 13px; color: var(--ink); background: rgba(255,255,255,0.08); border: 1px solid var(--line); border-radius: 999px; padding: 6px 11px; cursor: pointer; }
  .row button.sel { background: var(--gold); color: #1b1020; border-color: var(--gold); }
  .row button .sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; border: 1px solid rgba(255,255,255,0.6); }
  .sl { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); margin-top: 6px; }
  .sl input { flex: 1 1 0; width: 0; accent-color: var(--gold); }
  .sl b { width: 40px; text-align: right; color: var(--ink); font-weight: 700; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .acts button.main { background: var(--red); border-color: var(--red); }
  #note { font-size: 12px; color: var(--sub); margin-top: 8px; min-height: 1.4em; }
  #fold { display: none; }
  .hidden { display: none !important; }
  #panel h2 small { color: var(--sub); font-size: 11px; }
  #pcol { width: 40px; height: 30px; border: 0; padding: 0; background: none; cursor: pointer; }
  .row button.on { box-shadow: inset 0 0 0 2px var(--gold); }
  #paint { position: fixed; inset: 0; background: rgba(10,6,20,0.6); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  #paint .pbox { background: #1c1430; border-radius: 16px; padding: 14px; width: 100%; max-width: 380px; max-height: 100%; overflow-y: auto; }
  #paint h3 { margin: 0 0 8px; font-size: 16px; color: var(--gold); }
  #pc { display: block; width: 100%; aspect-ratio: 1; touch-action: none; border-radius: 8px; cursor: crosshair; background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 20px 20px; }
  #paint .row { margin-top: 8px; align-items: center; }
  #paint .sl { margin-top: 8px; }
  #paint .pal button { width: 26px; height: 26px; padding: 0; border-radius: 50%; }
  #paint .ok { display: flex; gap: 8px; margin-top: 12px; }
  #paint .ok button { flex: 1; font: inherit; font-size: 15px; padding: 10px; border-radius: 999px; border: 0; cursor: pointer; }
  #pOk { background: var(--red); color: #fff; } #pCancel { background: rgba(255,255,255,0.15); color: #fff; }
  #pFile { display: none; }
  #hint { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); background: rgba(16,12,32,0.85); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 14px; pointer-events: none; white-space: nowrap; }
  @media (max-width: 700px) {
    #panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 46vh; border-radius: 16px 16px 0 0; padding: 12px 16px 16px; }
    #panel.min { max-height: 52px; overflow: hidden; }
    #fold { display: block; position: sticky; top: 0; float: right; z-index: 1; margin: -4px -4px 0 8px; font: inherit; font-size: 13px; color: var(--ink); background: rgba(255,255,255,0.12); border: 0; border-radius: 999px; padding: 4px 12px; }
    #head h1 { font-size: 20px; }
    #back { bottom: auto; top: 48px; }
  }
</style>
</head>
<body>
<div id="head"><h1>だんじりエディター</h1><span class="beta">テスト版</span></div>
<div id="hint" class="hidden"></div>
<div id="paint" class="hidden"><div class="pbox">
  <h3>絵を描く <small style="color:var(--sub);font-size:11px">（白黒のマスは透明）</small></h3>
  <canvas id="pc" width="256" height="256"></canvas>
  <div class="row" id="ptool"><button data-t="pen" class="sel">ペン</button><button data-t="eraser">消しゴム</button><button data-t="fill">塗りつぶし</button><input id="pColor" type="color" value="#d42a1e"></div>
  <div class="row pal" id="ppal"></div>
  <div class="sl">太さ<input id="pSize" type="range" min="2" max="40" value="8"><b id="pSizeV">8</b></div>
  <div class="row"><button id="pUndo">ひとつ戻す</button><button id="pClear">全部消す</button><button id="pWhite">白で塗る</button><button id="pLoad">画像を下絵に</button><input id="pFile" type="file" accept="image/*"></div>
  <div class="ok"><button id="pCancel">やめる</button><button id="pOk">できた（ハメる）</button></div>
</div></div>
<a id="back" href="./">← ゲームへ</a>
<div id="panel">
  <button id="fold">たたむ</button>
  <h2>見本から始める</h2><div class="row" id="presets"></div>
  <h2>屋根</h2><div class="row" id="roof"></div>
  <h2>飾り（いくつでも）</h2><div class="row" id="deco"></div>
  <div class="sl">高さ<input id="decoY" type="range" min="-2" max="2" step="0.05"><b id="decoYv"></b></div>
  <div class="sl">大きさ<input id="decoS" type="range" min="0.5" max="1.6" step="0.05"><b id="decoSv"></b></div>
  <h2>龍の色</h2><div class="row" id="dragonC"></div>
  <h2>部品（つける / はずす）</h2><div class="row" id="flags"></div>
  <h2>自作パーツ <small>（形を選んで、だんじりをタップしてハメる）</small></h2><div class="row" id="shapes"></div>
  <div id="pedit" class="hidden">
    <div class="row" id="plist" style="margin-top:8px"></div>
    <div class="row" id="tmode" style="margin-top:8px"></div>
    <div class="row" id="pmat" style="margin-top:6px"></div>
    <div class="row" style="margin-top:6px;align-items:center"><input id="pcol" type="color"><button id="pmx">左右対称</button><button id="pdup">複製</button><button id="pdraw" class="hidden">絵を描きなおす</button><button id="pdel">削除</button><button id="pnone">選択やめる</button></div>
  </div>
  <h2>仕上げ</h2><div class="row" id="finish"></div>
  <h2>町（幕・幟の色）</h2><div class="row" id="team"></div>
  <div class="acts">
    <button id="save" class="main">保存</button>
    <button id="rand">おまかせ</button>
    <button id="share">URLをコピー</button>
    <button id="spin">回転 ON</button>
  </div>
  <div id="note"></div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="js/editor.js?v=135"></script>
</body>
</html>
